[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-interview-project"
version = "0.1.0"
description = "Projet RAG minimal et presentable pour entretien ML"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ui = ["streamlit>=1.36"]

[project.scripts]
rag-demo = "rag_project.cli:main"
rag-ui = "rag_project.app:main"

[tool.setuptools.packages.find]
where = ["src"]
